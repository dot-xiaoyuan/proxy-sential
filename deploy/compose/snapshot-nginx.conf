server {
    listen 80;
    access_log off;
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 32m;
    location / {
        set $upstream http://backend:18080;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
