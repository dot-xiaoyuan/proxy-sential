# 184 数据快照专用本地栈；独立卷目录和端口，网络不提供外部访问。
name: proxy-sentinel-dev184
services:
  postgres:
    image: postgres:18
    container_name: proxy-sentinel-dev184-postgres
    environment:
      POSTGRES_DB: proxy_sentinel
      POSTGRES_USER: proxy_sentinel
      POSTGRES_PASSWORD: ${DEV184_POSTGRES_PASSWORD:?}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["127.0.0.1:25433:5432"]
    volumes:
      - ${DEV184_DB_DIR:?}/postgres:/var/lib/postgresql
      - ${DEV184_SNAPSHOT_DIR:?}:/snapshot:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy_sentinel -d proxy_sentinel"]
      interval: 3s
      retries: 30
    networks: [snapshot, access]
  clickhouse:
    image: clickhouse/clickhouse-server:25.9.2.1
    container_name: proxy-sentinel-dev184-clickhouse
    environment:
      CLICKHOUSE_DB: proxy_sentinel
      CLICKHOUSE_USER: proxy_sentinel
      CLICKHOUSE_PASSWORD: ${DEV184_CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:28124:8123"]
    volumes:
      - ${DEV184_DB_DIR:?}/clickhouse:/var/lib/clickhouse
    mem_limit: 4g
    cpus: "4.0"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user proxy_sentinel --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 3s
      retries: 30
    networks: [snapshot, access]
  backend:
    image: golang:1.24-bookworm
    container_name: proxy-sentinel-dev184-backend
    init: true
    working_dir: /workspace
    command:
      - /workspace/data/dev184/bin/proxy-sentinel
      - control-plane
      - serve
      - --addr=0.0.0.0:18080
      - --storage-mode=db
      - --sensor-id=${DEV184_SENSOR_ID:?}
      - --read-only=false
      - --shadow-dir=/workspace/data/dev184/shadow
      - --frontend-dir=/workspace/frontend/dist
      - --applications-dir=/workspace/data/dev184/applications
      - --device-fingerprint-dir=/workspace/data/dev184/device-fingerprints
      - --device-fingerprint-auto-update=false
      - --export-dir=/workspace/data/dev184/exports
      - --postgres-migrations-dir=/workspace/migrations/postgres
    environment:
      PROXY_SENTINEL_POSTGRES_DSN: postgres://proxy_sentinel:${DEV184_POSTGRES_PASSWORD}@postgres:5432/proxy_sentinel?sslmode=disable
      PROXY_SENTINEL_CLICKHOUSE_DSN: http://clickhouse:8123/?user=proxy_sentinel&password=${DEV184_CLICKHOUSE_PASSWORD}&database=proxy_sentinel
      PROXY_SENTINEL_ACTION_MASTER_KEY: ${DEV184_ACTION_MASTER_KEY:?}
      PROXY_SENTINEL_PASSIVE_DISCOVERY_DISABLED: "true"
      PROXY_SENTINEL_DEVICE_FINGERPRINT_DIR: /workspace/data/dev184/device-fingerprints
      PROXY_SENTINEL_ACTIVITY_READ_MODEL_V3: "true"
      PROXY_SENTINEL_RECOGNITION_SUMMARY_V1: "true"
      PROXY_SENTINEL_DOMAIN_RECOGNITION_DISABLED: "true"
    volumes: ["${DEV184_ROOT:?}:/workspace"]
    mem_limit: 2g
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    networks: [snapshot]
  realtime:
    extends: {service: backend}
    container_name: proxy-sentinel-dev184-realtime
    command:
      - /workspace/data/dev184/bin/proxy-sentinel
      - read-model
      - run
      - --lane=realtime
      - --sensor-id=${DEV184_SENSOR_ID:?}
    mem_limit: 1g
    cpus: "1.0"
  recognition:
    extends: {service: backend}
    container_name: proxy-sentinel-dev184-recognition
    command:
      - /workspace/data/dev184/bin/proxy-sentinel
      - read-model
      - run
      - --lane=recognition
      - --sensor-id=${DEV184_SENSOR_ID:?}
    mem_limit: 1g
    cpus: "1.0"
  edge:
    image: nginx:1.31.6-alpine
    container_name: proxy-sentinel-dev184-edge
    ports: ["127.0.0.1:18084:80"]
    volumes:
      - ${DEV184_ROOT:?}/deploy/compose/snapshot-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [snapshot, access]
networks:
  snapshot:
    internal: true
  access:

