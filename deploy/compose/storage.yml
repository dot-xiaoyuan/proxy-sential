name: proxy-sentinel-storage

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be a Coding registry image pinned by sha256 digest}
    container_name: proxy-sentinel-postgres
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proxy_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-proxy_sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-25432}:5432"
    volumes:
      # PostgreSQL 18 declares /var/lib/postgresql as its volume. Mounting a
      # child path is shadowed by an anonymous parent volume on Docker 18.09.
      - ${PROXY_SENTINEL_DATA_DIR:-/opt/proxy-sentinel/data/db}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?CLICKHOUSE_IMAGE must be a Coding registry image pinned by sha256 digest}
    container_name: proxy-sentinel-clickhouse
    restart: unless-stopped
    cpus: "8.0"
    mem_limit: 12g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-proxy_sentinel}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-proxy_sentinel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:-28123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_HOST_PORT:-29000}:9000"
    volumes:
      - ${PROXY_SENTINEL_DATA_DIR:-/opt/proxy-sentinel/data/db}/clickhouse/data:/var/lib/clickhouse
      - ${PROXY_SENTINEL_DATA_DIR:-/opt/proxy-sentinel/data/db}/clickhouse/logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
