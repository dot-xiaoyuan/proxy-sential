# Phase 1 event-bus shadow publisher for the 184 discovery worker.
# Install at /etc/systemd/system/proxy-sentinel-discovery.service.d/zz-eventbus-p1.conf.
# Remove this file and run `systemctl daemon-reload` to roll back to the current release.
[Service]
Environment=PROXY_SENTINEL_EVENT_BUS_SHADOW=true
Environment=PROXY_SENTINEL_EVENT_BUS_BROKERS=127.0.0.1:19092
Environment=PROXY_SENTINEL_EVENT_BUS_CLIENT_ID=discovery-ncu-184-router-pilot
Environment=PROXY_SENTINEL_EVENT_BUS_DISCOVERY_TOPIC=ps.discovery.events.v1
Environment=PROXY_SENTINEL_EVENT_BUS_QUEUE=8192
Environment=PROXY_SENTINEL_EVENT_BUS_STATS_PATH=/var/lib/proxy-sentinel/discovery-spool/stream-capture-stats/eventbus.stats
ExecStart=
ExecStart=/opt/proxy-sentinel/releases/2026.10.30-eventbus-p1/bin/discovery-worker --node ncu-184-router-pilot --interface bond0 --site ncu --domain bond0-passive-pilot --allow-cidrs 10.202.0.0/16 --collection-config /opt/proxy-sentinel/config/discovery-collection-stream-dnssd-b3.json --mode=stream --stream-journal /var/lib/proxy-sentinel/stream-discovery-layered-r7 --capture-scope-config /opt/proxy-sentinel/config/discovery-capture-scope-layered-r7.json --spool /var/lib/proxy-sentinel/discovery-spool --ssdp-describe=false
