# Install only on a host with an audited packet-source-recovery epoch.
# Keep this as a site-specific drop-in; 204 and fresh installations do not
# automatically enable packet recovery chain protection.
[Service]
ExecStartPost=
ExecStartPost=/usr/bin/python3 /opt/proxy-sentinel/current/scripts/protect_device_signal_rotations.py /opt/proxy-sentinel/data/device-signals/ttl.jsonl /opt/proxy-sentinel/data/packet-source-recovery
