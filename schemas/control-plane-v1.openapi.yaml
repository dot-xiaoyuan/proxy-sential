      responses:
        "200":
          description: Latest seven-day shadow evaluation and review readiness report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShadowEvaluation"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /shadow/review-samples:
    get:
      operationId: getShadowReviewSamples
      parameters:
        - name: date
          in: query
          description: Review sample date in YYYY-MM-DD; defaults to the latest available date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Stratified shadow samples for human review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShadowReviewSamples"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /audit-logs:
    get:
      operationId: listAuditLogs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Audit log entries.
          content:
            application/json:
              schema:
                type: object
                required: [logs, page]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  page:
                    $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /audit-logs/{audit_id}:
    get:
      operationId: getAuditLog
      parameters:
        - name: audit_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full audit log entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLog"
        "404":
          $ref: "#/components/responses/NotFound"
  /device-fingerprint-library:
    get:
      operationId: getDeviceFingerprintLibrary
      responses:
        "200":
          description: Active device fingerprint library status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFingerprintLibraryStatus"
  /device-fingerprint-library/update:
    post:
      operationId: updateDeviceFingerprintLibrary
      responses:
        "202": {description: "Durable asynchronous task accepted; query tasks for the business result", content: {application/json: {schema: {$ref: "#/components/schemas/OperationTask"}}}}
        "200":
          description: Updated device fingerprint library status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFingerprintLibraryStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Offline deployments require bundle import.
  /device-fingerprint-library/validate:
    post:
      operationId: validateDeviceFingerprintBundle
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle: { type: string, format: binary }
      responses:
        "202": {description: "Durable asynchronous task accepted; query tasks for the business result", content: {application/json: {schema: {$ref: "#/components/schemas/OperationTask"}}}}
        "200":
          description: Validated bundle manifest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceFingerprintBundleManifest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Bundle validation failed. }
  /device-fingerprint-library/import:
    post:
      operationId: importDeviceFingerprintBundle
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle: { type: string, format: binary }
      responses:
        "202": {description: "Durable asynchronous task accepted; query tasks for the business result", content: {application/json: {schema: {$ref: "#/components/schemas/OperationTask"}}}}
        "200":
          description: Imported and activated library status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceFingerprintLibraryStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Bundle validation failed. }
  /rules/reload:
    post:
      operationId: reloadRules
      responses:
        "202":
          description: Rule reload accepted in shadow mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleReloadResult"
        "403":
          $ref: "#/components/responses/Forbidden"
