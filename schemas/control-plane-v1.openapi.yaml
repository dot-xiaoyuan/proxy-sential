components:
  securitySchemes:
    IdentityBearer:
      type: http
      scheme: bearer
      description: Dedicated RADIUS/Portal integration credential; never a user session token.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Operation is disabled or not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    IpPath:
      name: ip
      in: path
      required: true
      schema:
        type: string
    LevelQuery:
      name: level
      in: query
      schema:
        $ref: "#/components/schemas/RiskLevel"
    EventFilterQuery:
      name: q
      in: query
      schema:
        type: string
    EventTypeQuery:
      name: type
      in: query
      schema:
        type: string
    SensorIdQuery:
      name: sensor_id
      in: query
      schema:
        type: string
    CampusIdQuery:
      name: campus_id
      in: query
      schema: { type: string }
    DepartmentQuery:
      name: department
      in: query
      schema: { type: string }
    PersonTypeQuery:
      name: person_type
      in: query
      schema: { type: string }
    SSIDQuery:
      name: ssid
      in: query
      schema: { type: string }
    VLANQuery:
      name: vlan
      in: query
      schema: { type: string }
    APQuery:
      name: ap
      in: query
      schema: { type: string }
    NASIPQuery:
      name: nas_ip
      in: query
      schema: { type: string }
    FromQuery:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    ToQuery:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    WindowQuery:
      name: window
      in: query
      schema:
        type: string
        enum: [10m, 1h, 24h]
    SrcIpQuery:
      name: src_ip
      in: query
      schema:
        type: string
    DstIpQuery:
      name: dst_ip
      in: query
      schema:
        type: string
    DomainQuery:
      name: domain
      in: query
      schema:
        type: string
    UserAgentQuery:
      name: user_agent
      in: query
      schema:
        type: string
    FingerprintQuery:
      name: fingerprint
      in: query
      description: JA3/JA4 fingerprint value from normalized event payload.
      schema:
        type: string
    PortQuery:
      name: port
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 65535
    ProtoQuery:
      name: proto
      in: query
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CursorQuery:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    LocalUser:
      type: object
      required: [user_id, username, display_name, role, disabled]
      properties:
        user_id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [viewer, reviewer, operator, admin] }
        disabled: { type: boolean }
    UserMutation:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [viewer, reviewer, operator, admin] }
        password: { type: string, minLength: 12 }
        disabled: { type: boolean }
    CampusException:
      type: object
      required: [scope_type, scope_value, reason]
      properties:
        exception_id: { type: string }
        scope_type: { type: string, enum: [ip, account, endpoint, campus, domain, cidr] }
        scope_value: { type: string }
        campus_id: { type: string }
        reason: { type: string }
        ruleset_version: { type: string }
        valid_from: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        enabled: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    Permission:
      type: string
      enum:
        - risks:read
        - evidence:read
        - events:read
        - labels:create
        - endpoints:write
        - shadow:read
        - audit:read
        - rules:reload
        - ingest:read
        - dpi:read
        - device-fingerprint-library:update
        - cases:read
        - cases:write
        - identity:read
        - organization:read
        - organization:write
        - actions:read
        - actions:execute
        - actions:revoke
        - integrations:write
        - users:manage
    Page:
      type: object
      required: [limit, next_cursor, total]
      properties:
        limit:
          type: integer
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
    DeviceFingerprintLibraryStatus:
      type: object
      required: [version, status, source, checksum]
      properties:
        version: { type: string }
        status:
          type: string
          enum: [ready, checking, degraded]
        source: { type: string }
        checksum: { type: string }
        updated_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
        last_error: { type: string }
        offline_mode: { type: boolean }
        rule_count: { type: integer }
        oui_count: { type: integer }
        dhcp_rule_count: { type: integer }
        sources:
          type: array
          items: { $ref: "#/components/schemas/DeviceFingerprintBundleSource" }
        licenses:
          type: array
          items: { type: string }
        backfill_status: { type: string }
        backfill_processed: { type: integer }
    DeviceFingerprintBundleSource:
      type: object
      required: [name, version, url, license]
      properties:
        name: { type: string }
        version: { type: string }
        url: { type: string }
        license: { type: string }
    DeviceFingerprintBundleManifest:
      type: object
      required: [schema_version, version, created_at, sources, files]
      properties:
        schema_version: { type: string }
        version: { type: string }
        created_at: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: "#/components/schemas/DeviceFingerprintBundleSource" }
        files:
          type: object
          additionalProperties:
            type: object
            required: [size, sha256]
            properties:
              size: { type: integer }
              sha256: { type: string }
    Role:
      type: string
      enum: [viewer, reviewer, operator, admin]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    Session:
      type: object
      required: [user, role, permissions]
      properties:
        user:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
