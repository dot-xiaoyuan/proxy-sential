  /tasks/{task_id}:
    get:
      operationId: getOperationTask
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "Owner or administrator task state and completed business result", content: {application/json: {schema: {$ref: "#/components/schemas/OperationTask"}}}}
  /tasks/{task_id}/cancel:
    post:
      operationId: cancelOperationTask
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "Task cancelled", content: {application/json: {schema: {$ref: "#/components/schemas/OperationTask"}}}}
        "409": {description: "Task already terminal"}

components:
  securitySchemes:
    IdentityBearer:
      type: http
      scheme: bearer
      description: Dedicated RADIUS/Portal integration credential; never a user session token.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Operation is disabled or not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    IpPath:
      name: ip
      in: path
      required: true
      schema:
        type: string
    LevelQuery:
      name: level
      in: query
      schema:
        $ref: "#/components/schemas/RiskLevel"
    EventFilterQuery:
      name: q
      in: query
      schema:
        type: string
    EventTypeQuery:
      name: type
      in: query
      schema:
        type: string
    SensorIdQuery:
      name: sensor_id
      in: query
      schema:
        type: string
    CampusIdQuery:
      name: campus_id
      in: query
      schema: { type: string }
    DepartmentQuery:
      name: department
      in: query
      schema: { type: string }
    PersonTypeQuery:
      name: person_type
      in: query
      schema: { type: string }
    SSIDQuery:
      name: ssid
      in: query
      schema: { type: string }
    VLANQuery:
      name: vlan
      in: query
      schema: { type: string }
    APQuery:
      name: ap
      in: query
      schema: { type: string }
    NASIPQuery:
      name: nas_ip
      in: query
      schema: { type: string }
    FromQuery:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    ToQuery:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    WindowQuery:
      name: window
      in: query
      schema:
        type: string
        enum: [10m, 1h, 24h]
    SrcIpQuery:
      name: src_ip
      in: query
      schema:
        type: string
    DstIpQuery:
      name: dst_ip
      in: query
      schema:
        type: string
    DomainQuery:
      name: domain
      in: query
      schema:
        type: string
    UserAgentQuery:
      name: user_agent
      in: query
      schema:
        type: string
    FingerprintQuery:
      name: fingerprint
      in: query
      description: JA3/JA4 fingerprint value from normalized event payload.
      schema:
        type: string
    PortQuery:
      name: port
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 65535
    ProtoQuery:
      name: proto
      in: query
      schema:
        type: string
    AppProtocolQuery:
      name: app_protocol
      in: query
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CursorQuery:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    SharedDisconnectPreview:
      type: object
      required: [review_id, connector_id, evidence_version, identity_version, config_version, fingerprint, ready, blockers, plan]
      properties:
        review_id: { type: string }
        connector_id: { type: string }
        evidence_version: { type: integer }
        identity_version: { type: integer }
        config_version: { type: string }
        fingerprint: { type: string }
        ready: { type: boolean }
        blockers: { type: array, items: { type: string } }
        plan:
          type: object
          required: [account, campus_id, access_domain, sessions]
          properties:
            account: { type: string }
            campus_id: { type: string }
            access_domain: { type: string }
            fingerprint: { type: string }
            sessions:
              type: array
              items:
                type: object
                required: [target, addresses]
                properties:
                  addresses: { type: array, items: { type: string } }
                  target:
                    type: object
                    required: [session_id, raw_online_id]
                    properties:
                      session_id: { type: string }
                      raw_online_id: { type: string }
    SharedAccessReview:
      type: object
      required: [review_id, account_id, campus_id, access_domain, session_generation, episode, state, latest_version, latest_result, coverage_state, created_at, updated_at]
      properties:
        review_id: { type: string }
        account_id: { type: string }
        campus_id: { type: string }
        access_domain: { type: string }
        session_generation: { type: string }
        episode: { type: integer }
        state: { type: string }
        latest_version: { type: integer }
        latest_result: { type: object, additionalProperties: true }
        coverage_state: { type: string, enum: [unknown, verified, insufficient] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_conclusion: { type: object, additionalProperties: true }
    SharedBehaviorScoreComponent:
      type: object
      required: [signal, score, explanation]
      properties:
        signal: { type: string, enum: [ua_os, ttl_path, tcp_stack, tls_stack, dhcp_stack, router_identity, vendor_gateway_identity] }
        score: { type: integer }
        explanation: { type: string }
    SharedBehaviorRouterContext:
      type: object
      properties:
        assessment_id: { type: string }
        brand: { type: string }
        model: { type: string }
        role: { type: string }
        status: { type: string, enum: [candidate, likely, confirmed] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        brand_attribution: { type: boolean }
    SharedBehaviorKnownDevice:
      type: object
      required: [identity_id, model, observations, first_seen, last_seen]
      properties:
        identity_id: { type: string }
        brand: { type: string }
        model: { type: string }
        os_family: { type: string }
        device_type: { type: string }
        observations: { type: integer, minimum: 2 }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
    SharedBehaviorAssessment:
      type: object
      required: [observation_id, sensor_id, ip, status, confidence, signal_groups, reasons, conflicts, coverage_state, rule_version, first_seen, last_seen, window_start, window_end, expires_at, router, score_components, feature_samples, event_ids, known_device_count, known_devices]
      properties:
        observation_id: { type: string }
        sensor_id: { type: string }
        campus_id: { type: string }
        access_domain: { type: string }
        ip: { type: string }
        endpoint_id: { type: string }
        status: { type: string, enum: [candidate, likely, confirmed] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        signal_groups: { type: array, items: { type: string } }
        reasons: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: string } }
        coverage_state: { type: string, enum: [unknown, partial, verified] }
        rule_version: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        router: { $ref: '#/components/schemas/SharedBehaviorRouterContext' }
        score_components: { type: array, items: { $ref: '#/components/schemas/SharedBehaviorScoreComponent' } }
        feature_samples:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        event_ids: { type: array, items: { type: string } }
        known_device_count: { type: integer, minimum: 0 }
        known_device_basis: { type: string, enum: [explicit_hardware_model_lower_bound, ieee1905_association_current] }
        known_device_window: { type: string, enum: [24h, current] }
        known_devices: { type: array, items: { $ref: '#/components/schemas/SharedBehaviorKnownDevice' } }
    SharedBehaviorHistory:
      type: object
      required: [status, confidence, signal_groups, coverage_state, rule_version, observed_at, created_at]
      properties:
        status: { type: string, enum: [candidate, likely, confirmed] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        signal_groups: { type: array, items: { type: string } }
        coverage_state: { type: string, enum: [unknown, partial, verified] }
        rule_version: { type: string }
        observed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    SharedBehaviorDetail:
      allOf:
        - { $ref: '#/components/schemas/SharedBehaviorAssessment' }
        - type: object
          required: [history]
          properties:
            history: { type: array, items: { $ref: '#/components/schemas/SharedBehaviorHistory' } }
    SharedBehaviorPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SharedBehaviorAssessment' } }
        page:
          type: object
          required: [limit, next_cursor, total]
          properties:
            limit: { type: integer }
            next_cursor: { type: [string, 'null'] }
            total: { type: integer }
    SharedReviewHistoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        next_cursor: { type: string }
    ManagedIdentityConfiguration:
      type: object
      required: [kind, source, sensor_id, campus_id, access_domain, user_cidrs, max_records, enabled]
      properties:
        kind: { type: string, enum: [online_equipment, complete_inventory] }
        source: { type: string }
        sensor_id: { type: string }
        campus_id: { type: string }
        access_domain: { type: string }
        user_cidrs: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        inventory_url: { type: string }
        token: { type: string, writeOnly: true }
        max_records: { type: integer, minimum: 1, maximum: 10000 }
        enabled: { type: boolean }
    ManagedIdentitySource:
      type: object
      required: [configuration, config_version, token_configured, state, blocker]
      properties:
        configuration: { $ref: '#/components/schemas/ManagedIdentityConfiguration' }
        config_version: { type: integer }
        token_configured: { type: boolean }
        state: { type: string }
        blocker: { type: string }
    FourKDatabaseConfig:
      type: object
      additionalProperties: false
      required: [host, port, database, username, tls]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        database: { type: string, maxLength: 64 }
        username: { type: string, maxLength: 128 }
        password: { type: string, writeOnly: true, maxLength: 4096 }
        tls: { type: boolean }
        authorization_id: { type: integer, minimum: 0, description: Zero or omitted selects the unique enabled unexpired authorization. }
    FourKDatabaseResponse:
      type: object
      required: [configuration, password_configured, credential_source]
      properties:
        configuration: { $ref: '#/components/schemas/FourKDatabaseConfig' }
        password_configured: { type: boolean }
        credential_source: { type: string, enum: [4k_database] }

    OperationTask:
      type: object
      required: [task_id, kind, status, created_at]
      properties:
        task_id: {type: string}
        kind: {type: string}
        status: {type: string, enum: [queued, running, completed, failed, cancelled]}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        result: {type: object, additionalProperties: true}
        error: {type: string}
        response_status: {type: integer}
    IdentitySnapshotRequest:
      type: object
      additionalProperties: false
      required: [source, sensor_id, campus_id, access_domain, observed_at, reconcile_interval_seconds, complete, expected_count, records]
      properties:
        source: { type: string, minLength: 1, maxLength: 200 }
        sensor_id: { type: string, minLength: 1, maxLength: 200 }
        campus_id: { type: string, minLength: 1, maxLength: 200 }
        access_domain: { type: string, minLength: 1, maxLength: 200 }
        observed_at:
          type: string
          format: date-time
          description: Consistent upstream inventory time, within the past seven days, UTC with at most microsecond precision; never a fetch-completion timestamp for an inconsistent scan.
        reconcile_interval_seconds: { type: integer, minimum: 1, maximum: 86400 }
        complete: { type: boolean, enum: [true] }
        expected_count: { type: integer, minimum: 0, maximum: 10000 }
        records:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [session_id, account_id, ip]
            properties:
              session_id: { type: string, minLength: 1 }
              account_id: { type: string, minLength: 1 }
              ip: { type: string }
              endpoint_id: { type: string }
              mac: { type: string }
              group_id: { type: string }
              product_id: { type: string }
              device_class: { type: string, enum: [mobile, pc, other] }
            additionalProperties: { type: string }
    IdentitySnapshotReceipt:
      type: object
      required: [snapshot_id, status, observed_at, session_count, replayed]
      properties:
        snapshot_id: { type: string }
        status: { type: string, enum: [completed] }
        observed_at: { type: string, format: date-time }
        session_count: { type: integer }
        replayed: { type: boolean }
    IdentitySourceStatus:
      type: object
      required: [source, sensor_id, campus_id, access_domain, snapshot_id, observed_at, received_at, reconcile_interval_seconds, session_count, state, age_seconds]
