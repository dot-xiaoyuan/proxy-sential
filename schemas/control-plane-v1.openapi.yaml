          type: string
          enum: [v1]
        diagnostic_id:
          type: string
        timestamp:
          type: string
          format: date-time
        sensor_id:
          type: string
        collector:
          $ref: "#/components/schemas/Collector"
        stage:
          type: string
          enum: [capture, decode, normalize, evidence, risk]
