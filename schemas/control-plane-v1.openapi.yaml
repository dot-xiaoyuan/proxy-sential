openapi: 3.1.0
info:
  title: Proxy Sentinel Control Plane API
  version: 1.0.0
  description: Control-plane contract for the Proxy Sentinel frontend. The API exposes normalized events, evidence, risk snapshots, labels, shadow runs, audit logs, and session state.
servers:
  - url: /api/v1
paths:
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current mock or authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "500":
          $ref: "#/components/responses/InternalError"
  /overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Operations overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "500":
          $ref: "#/components/responses/InternalError"
  /activity/overview:
    get:
      operationId: getActivityOverview
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
            default: 1h
      responses:
        "200":
          description: Aggregated access posture and client feature overview for the observed domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/overview:
    get:
      operationId: getDpiOverview
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
            default: 1h
      responses:
        "200":
          description: DPI metadata overview derived from normalized events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/trends:
    get:
      operationId: listDpiTrends
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h]
            default: 1h
      responses:
        "200":
          description: DPI event and device trend points.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items:
                      $ref: "#/components/schemas/DpiTrendPoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/protocol-flows:
    get:
      operationId: listDpiProtocolFlows
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
            default: 1h
      responses:
        "200":
          description: Protocol flow distribution based on normalized event metadata.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DpiProtocolFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/fingerprint-conflicts:
    get:
      operationId: listDpiFingerprintConflicts
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
            default: 1h
      responses:
        "200":
          description: Standardized fingerprint conflicts observed in a window.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DpiFingerprintConflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/flows:
    get:
      operationId: listDpiFlows
      parameters:
        - $ref: "#/components/parameters/EventFilterQuery"
        - $ref: "#/components/parameters/EventTypeQuery"
        - $ref: "#/components/parameters/SensorIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - $ref: "#/components/parameters/WindowQuery"
        - $ref: "#/components/parameters/SrcIpQuery"
        - $ref: "#/components/parameters/DstIpQuery"
        - $ref: "#/components/parameters/DomainQuery"
        - $ref: "#/components/parameters/UserAgentQuery"
        - $ref: "#/components/parameters/FingerprintQuery"
        - $ref: "#/components/parameters/PortQuery"
        - $ref: "#/components/parameters/ProtoQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
      responses:
        "200":
          description: Filtered DPI flow samples built from normalized events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiFlowListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/flows/{flow_id}:
    get:
      operationId: getDpiFlow
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DPI flow detail with normalized event, evidence and risk context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiFlowDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/ips/{ip}/flows:
    get:
      operationId: listIpDpiFlows
      parameters:
        - $ref: "#/components/parameters/IpPath"
        - $ref: "#/components/parameters/EventFilterQuery"
        - $ref: "#/components/parameters/EventTypeQuery"
        - $ref: "#/components/parameters/SensorIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - $ref: "#/components/parameters/WindowQuery"
        - $ref: "#/components/parameters/DstIpQuery"
        - $ref: "#/components/parameters/DomainQuery"
        - $ref: "#/components/parameters/UserAgentQuery"
        - $ref: "#/components/parameters/FingerprintQuery"
        - $ref: "#/components/parameters/PortQuery"
        - $ref: "#/components/parameters/ProtoQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
      responses:
        "200":
          description: DPI flow samples for one source IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiFlowListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /risks:
    get:
      operationId: listRisks
      parameters:
        - $ref: "#/components/parameters/LevelQuery"
        - name: q
          in: query
          schema:
            type: string
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Filtered risk snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/risk:
    get:
      operationId: getIpRisk
      parameters:
        - $ref: "#/components/parameters/IpPath"
      responses:
        "200":
          description: Current risk snapshot for an IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/evidence:
    get:
      operationId: getIpEvidence
      parameters:
        - $ref: "#/components/parameters/IpPath"
      responses:
        "200":
          description: Evidence timeline for an IP.
          content:
            application/json:
              schema:
                type: object
                required: [evidence]
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: "#/components/schemas/Evidence"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/activity:
    get:
      operationId: getIpActivity
      parameters:
        - $ref: "#/components/parameters/IpPath"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Aggregated access and client feature profile for an IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpActivityProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/events:
    get:
      operationId: getIpEvents
      parameters:
        - $ref: "#/components/parameters/IpPath"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Normalized event summaries for an IP.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/NormalizedEventSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /events:
    get:
      operationId: listEvents
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
        - name: src_ip
          in: query
          schema:
            type: string
        - name: dst_ip
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: user_agent
          in: query
          schema:
            type: string
        - name: fingerprint
          in: query
          description: JA3/JA4 fingerprint value from normalized event payload.
          schema:
            type: string
        - name: port
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 65535
        - name: proto
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Filtered normalized event samples.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /events/{event_id}:
    get:
      operationId: getEvent
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One normalized event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedEventSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /ingest/status:
    get:
      operationId: getIngestStatus
      responses:
        "200":
          description: Current collector and normalization status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /ingest/runs:
    get:
      operationId: listIngestRuns
      responses:
        "200":
          description: Collector and risk analysis runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShadowRun"
        "500":
          $ref: "#/components/responses/InternalError"
  /ingest/diagnostics:
    get:
      operationId: listIngestDiagnostics
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Collector diagnostics and normalization statistics.
          content:
            application/json:
              schema:
                type: object
                required: [diagnostics]
                properties:
                  diagnostics:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestDiagnostic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ingest/event-types:
    get:
      operationId: listIngestEventTypes
      responses:
        "200":
          description: Latest event type distribution.
          content:
            application/json:
              schema:
                type: object
                required: [event_types]
                properties:
                  event_types:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventTypeCount"
        "500":
          $ref: "#/components/responses/InternalError"
  /ingest/errors:
    get:
      operationId: listIngestErrors
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Warning or error diagnostics.
          content:
            application/json:
              schema:
                type: object
                required: [diagnostics]
                properties:
                  diagnostics:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestDiagnostic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /labels:
    post:
      operationId: createLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabelRequest"
      responses:
        "201":
          description: Created label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /shadow/runs:
    get:
      operationId: listShadowRuns
      responses:
        "200":
          description: Shadow mode run summaries.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShadowRun"
        "500":
          $ref: "#/components/responses/InternalError"
  /audit-logs:
    get:
      operationId: listAuditLogs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Audit log entries.
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /rules/reload:
    post:
      operationId: reloadRules
      responses:
        "202":
          description: Rule reload accepted in shadow mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleReloadResult"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Operation is disabled or not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    IpPath:
      name: ip
      in: path
      required: true
      schema:
        type: string
    LevelQuery:
      name: level
      in: query
      schema:
        $ref: "#/components/schemas/RiskLevel"
    EventFilterQuery:
      name: q
      in: query
      schema:
        type: string
    EventTypeQuery:
      name: type
      in: query
      schema:
        type: string
    SensorIdQuery:
      name: sensor_id
      in: query
      schema:
        type: string
    FromQuery:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    ToQuery:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    WindowQuery:
      name: window
      in: query
      schema:
        type: string
        enum: [10m, 1h, 24h]
    SrcIpQuery:
      name: src_ip
      in: query
      schema:
        type: string
    DstIpQuery:
      name: dst_ip
      in: query
      schema:
        type: string
    DomainQuery:
      name: domain
      in: query
      schema:
        type: string
    UserAgentQuery:
      name: user_agent
      in: query
      schema:
        type: string
    FingerprintQuery:
      name: fingerprint
      in: query
      description: JA3/JA4 fingerprint value from normalized event payload.
      schema:
        type: string
    PortQuery:
      name: port
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 65535
    ProtoQuery:
      name: proto
      in: query
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CursorQuery:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    Permission:
      type: string
      enum:
        - risks:read
        - evidence:read
        - events:read
        - labels:create
        - shadow:read
        - audit:read
        - rules:reload
        - ingest:read
        - dpi:read
    Role:
      type: string
      enum: [viewer, reviewer, operator, admin]
    Session:
      type: object
      required: [user, role, permissions]
      properties:
        user:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    RiskLevel:
      type: string
      enum: [normal, suspicious, high, confirmed]
    RecommendedAction:
      type: string
      enum: [record, shadow_watch, shadow_manual_review, shadow_confirm_review]
    EvidenceSeverity:
      type: string
      enum: [low, medium, high]
    RiskSnapshot:
      type: object
      required: [ip, score, level, confidence, window, evidence_ids, summary, recommended_action, updated_at]
      properties:
        ip:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        level:
          $ref: "#/components/schemas/RiskLevel"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        window:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        summary:
          type: string
        recommended_action:
          $ref: "#/components/schemas/RecommendedAction"
        updated_at:
          type: string
          format: date-time
    RiskListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RiskSnapshot"
        page:
          type: object
          required: [limit, next_cursor, total]
          properties:
            limit:
              type: integer
            next_cursor:
              type:
                - string
                - "null"
            total:
              type: integer
    EventListResponse:
      type: object
      required: [events, page]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/NormalizedEventSummary"
        page:
          type: object
          required: [limit, next_cursor, total]
          properties:
            limit:
              type: integer
            next_cursor:
              type:
                - string
                - "null"
            total:
              type: integer
    Evidence:
      type: object
      required: [evidence_id, ip, type, window, score, confidence, severity, reason, samples, created_at]
      properties:
        evidence_id:
          type: string
        ip:
          type: string
        type:
          type: string
          enum: [multi_user_agent, multi_ja3_ja4, ttl_clusters, domain_diversity, port_distribution, multi_device_fingerprint]
        window:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        severity:
          $ref: "#/components/schemas/EvidenceSeverity"
        reason:
          type: string
        samples:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    NormalizedEventSummary:
      type: object
      required: [event_id, type, timestamp, subject, flow, confidence]
      properties:
        event_id:
          type: string
        source:
          type: string
        type:
          type: string
          enum: [flow, dns, tls, http, quic, device, alert]
        timestamp:
          type: string
          format: date-time
        observer:
          type: object
          additionalProperties: true
        subject:
          type: object
          additionalProperties: true
        flow:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: true
        confidence:
          type: number
        raw_ref:
          type: object
          additionalProperties: true
    ActivityCount:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
        last_seen:
          type: string
          format: date-time
    ActivityIpSummary:
      type: object
      required: [ip, event_count, risk_level, score, top_domains]
      properties:
        ip:
          type: string
        event_count:
          type: integer
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        score:
          type: integer
        top_domains:
          type: array
          items:
            $ref: "#/components/schemas/ActivityCount"
        last_seen:
          type: string
          format: date-time
    ActivityOverview:
      type: object
      required:
        - sensor_id
        - window
        - event_count
        - active_ip_count
        - access_object_count
        - active_risk_ip_count
        - event_type_counts
        - protocol_counts
        - top_domains
        - top_http_hosts
        - top_tls_sni
        - top_user_agents
        - top_tls_fingerprints
        - top_dst_ports
        - top_dst_ips
        - top_source_ips
        - top_active_risk_ips
      properties:
        sensor_id:
          type: string
        window:
          type: string
          enum: [10m, 1h, 24h, latest-run]
        event_count:
          type: integer
        active_ip_count:
          type: integer
        access_object_count:
          type: integer
        active_risk_ip_count:
          type: integer
        first_seen:
