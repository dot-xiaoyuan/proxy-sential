    ShadowReviewSamples:
      type: object
      required: [date, dates, samples_per_level, samples]
      properties:
        date: { type: string, format: date }
        dates:
          type: array
          items: { type: string, format: date }
        samples_per_level: { type: integer }
        samples:
          type: array
          items:
            $ref: "#/components/schemas/ShadowReviewSample"
    Overview:
      type: object
      required: [level_counts, pending_reviews, latest_shadow_run, throughput, top_evidence]
      properties:
        statistics_as_of:
          type: string
          format: date-time
          description: Source time of the statistics, at most five seconds old on a successful fresh response.
        data_freshness:
          $ref: "#/components/schemas/DataFreshness"
        level_counts:
          type: object
          required: [normal, suspicious, high, confirmed]
          properties:
            normal:
              type: integer
            suspicious:
              type: integer
            high:
              type: integer
            confirmed:
              type: integer
        pending_reviews:
          type: integer
        open_case_count:
          type: integer
        overdue_case_count:
          type: integer
        latest_shadow_run:
          $ref: "#/components/schemas/ShadowRun"
        throughput:
          type: object
          required: [events, evidence, risks]
          properties:
            events:
              type: integer
            evidence:
              type: integer
            risks:
              type: integer
        top_evidence:
          type: array
          items:
            type: object
            required: [type, count]
            properties:
              type:
                type: string
              count:
                type: integer
    RuleReloadResult:
      type: object
      required: [status, mode, requested_at]
      properties:
        status:
          type: string
          enum: [accepted, disabled]
        mode:
          type: string
          enum: [shadow]
        requested_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
