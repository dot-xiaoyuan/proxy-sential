openapi: 3.1.0
info:
  title: Proxy Sentinel Control Plane API
  version: 1.0.0
  description: Control-plane contract for the Proxy Sentinel frontend. The API exposes normalized events, evidence, risk snapshots, labels, shadow runs, audit logs, and session state.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session with a CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials or rate limit reached.
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Session deleted.
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current mock or authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "500":
          $ref: "#/components/responses/InternalError"
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          description: Readiness of storage, authentication, identity ingestion, and the offline fingerprint library.
          content:
            application/json:
              schema:
                type: object
                required: [status, components, checked_at]
                properties:
                  status: { type: string, enum: [ready, degraded] }
                  components:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status: { type: string }
                        error: { type: string }
                  fingerprint_library: { type: object, additionalProperties: true }
                  fingerprint_offline_mode: { type: boolean }
                  global_read_only: { type: boolean }
                  checked_at: { type: string, format: date-time }
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: Local RBAC users.
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/LocalUser" } }, page: { $ref: "#/components/schemas/Page" } } } } }
        "403": { description: Administrator permission required. }
    post:
      operationId: createUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserMutation" } } } }
      responses:
        "201": { description: User created., content: { application/json: { schema: { $ref: "#/components/schemas/LocalUser" } } } }
        "403": { description: Administrator permission required. }
  /users/{user_id}/{operation}:
    post:
      operationId: updateUser
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
        - { name: operation, in: path, required: true, schema: { type: string, enum: [profile, password, disable, enable] } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserMutation" } } } }
      responses:
        "200": { description: User updated., content: { application/json: { schema: { $ref: "#/components/schemas/LocalUser" } } } }
  /campus-exceptions:
    get:
      operationId: listCampusExceptions
      responses:
        "200": { description: Versioned campus exception rules., content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/CampusException" } }, page: { $ref: "#/components/schemas/Page" } } } } } }
    post:
      operationId: createCampusException
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampusException" } } } }
      responses:
        "201": { description: Exception created., content: { application/json: { schema: { $ref: "#/components/schemas/CampusException" } } } }
  /campus-exceptions/{exception_id}/disable:
    post:
      operationId: disableCampusException
      parameters:
        - { name: exception_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Exception disabled., content: { application/json: { schema: { $ref: "#/components/schemas/CampusException" } } } }
  /cases:
    get:
      operationId: listCases
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: assignee_id, in: query, schema: { type: string } }
        - { name: campus_id, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: person_type, in: query, schema: { type: string } }
        - { name: ssid, in: query, schema: { type: string } }
        - { name: vlan, in: query, schema: { type: string } }
        - { name: ap, in: query, schema: { type: string } }
        - { name: nas_ip, in: query, schema: { type: string } }
        - { name: window, in: query, schema: { type: string, enum: [24h, 7d] } }
      responses:
        "200":
          description: Paginated operational risk cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskCaseListResponse"
  /cases/{case_id}:
    get:
      operationId: getCase
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Case with immutable evidence snapshot and timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskCase"
        "404":
          $ref: "#/components/responses/NotFound"
  /cases/{case_id}/{operation}:
    post:
      operationId: updateCase
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
        - { name: operation, in: path, required: true, schema: { type: string, enum: [assign, status, priority, disposition, comments] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskCase"
        "403":
          $ref: "#/components/responses/Forbidden"
  /cases/batch:
    post:
      operationId: mutateCasesBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_ids, operation]
              properties:
                case_ids: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
                operation: { type: string, enum: [assign, close] }
                assignee_id: { type: string }
      responses:
        "200": { description: Cases updated atomically. }
        "409": { description: At least one case cannot perform the requested transition. }
  /organization:
    get:
      operationId: getOrganization
      responses:
        "200":
          description: Campus, building, network-zone and access-point mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /organization/{kind}:
    post:
      operationId: saveOrganizationItem
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [campuses, buildings, network-zones, access-points] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201": { description: Organization or network-location mapping saved. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /actions/connectors:
    get:
      operationId: listActionConnectors
      responses:
        "200":
          description: Northbound connectors without credential material.
          content:
            application/json:
              schema:
                type: object
                required: [items, global_stop]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ActionConnector" } }
                  global_stop: { type: boolean }
    post:
      operationId: saveActionConnector
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Connector saved; secret is never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionConnector" }
  /actions:
    get:
      operationId: listActions
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated enforcement actions.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EnforcementAction" } }
                  page: { $ref: "#/components/schemas/Page" }
  /actions/execute:
    post:
      operationId: executeAction
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Action persisted before asynchronous delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementAction" }
  /actions/{action_id}/revoke:
    post:
      operationId: revokeAction
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Revocation accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementAction" }
  /integrations/identity/events:
    post:
      operationId: ingestIdentityEvents
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      security:
        - IdentityBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Identity batch normalized and accepted.
  /integrations/identity/status:
    get:
      operationId: getIdentityIngestStatus
      responses:
        "200":
          description: Recent identity batches and data freshness.
  /integrations/identity/batches:
    get:
      operationId: listIdentityBatches
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated identity batches with status, error detail and retry count.
  /integrations/identity/batches/{batch_id}/replay:
    post:
      operationId: replayIdentityBatch
      parameters:
        - { name: batch_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Retained normalized identity events were replayed idempotently.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Batch has no retained normalized events or PostgreSQL replay is unavailable.
  /overview:
    get:
      operationId: getOverview
      parameters:
        - { name: sensor_id, in: query, schema: { type: string } }
        - { name: campus_id, in: query, schema: { type: string } }
        - { name: window, in: query, schema: { type: string, enum: [10m, 1h, 24h, 7d], default: 1h } }
        - { name: as_of, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Operations overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "500":
          $ref: "#/components/responses/InternalError"
  /activity/overview:
    get:
      operationId: getActivityOverview
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h, 7d]
            default: 1h
        - { name: campus_id, in: query, schema: { type: string } }
        - { name: as_of, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Aggregated access posture and client feature overview for the observed domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /proxy-reviews:
    get:
      operationId: listProxyReviews
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [24h, 7d]
            default: 7d
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: view
          in: query
          schema:
            type: string
            enum: [summary, full]
            default: summary
      responses:
        "200":
          description: Account and endpoint scoped proxy/VPN review cases aggregated from normalized TLS, QUIC, and alert events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /proxy-reviews/{case_id}:
    get:
      operationId: getProxyReview
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [24h, 7d]
            default: 7d
      responses:
        "200":
          description: Full proxy review case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyReviewCase"
        "404":
          $ref: "#/components/responses/NotFound"
  /dpi/overview:
    get:
      operationId: getDpiOverview
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
            default: 1h
      responses:
        "200":
          description: DPI metadata overview derived from normalized events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/trends:
    get:
      operationId: listDpiTrends
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h]
            default: 1h
      responses:
        "200":
          description: DPI event and device trend points.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items:
                      $ref: "#/components/schemas/DpiTrendPoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/protocol-flows:
    get:
      operationId: listDpiProtocolFlows
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
            default: 1h
      responses:
        "200":
          description: Protocol flow distribution based on normalized event metadata.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DpiProtocolFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/fingerprint-conflicts:
    get:
      operationId: listDpiFingerprintConflicts
      parameters:
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
            default: 1h
      responses:
        "200":
          description: Standardized fingerprint conflicts observed in a window.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DpiFingerprintConflict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/flows:
    get:
      operationId: listDpiFlows
      parameters:
        - $ref: "#/components/parameters/EventFilterQuery"
        - $ref: "#/components/parameters/EventTypeQuery"
        - $ref: "#/components/parameters/SensorIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - $ref: "#/components/parameters/WindowQuery"
        - $ref: "#/components/parameters/SrcIpQuery"
        - $ref: "#/components/parameters/DstIpQuery"
        - $ref: "#/components/parameters/DomainQuery"
        - $ref: "#/components/parameters/UserAgentQuery"
        - $ref: "#/components/parameters/FingerprintQuery"
        - $ref: "#/components/parameters/PortQuery"
        - $ref: "#/components/parameters/ProtoQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
      responses:
        "200":
          description: Filtered DPI flow samples built from normalized events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiFlowListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/flows/{flow_id}:
    get:
      operationId: getDpiFlow
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DPI flow detail with normalized event, evidence and risk context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiFlowDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /dpi/ips/{ip}/flows:
    get:
      operationId: listIpDpiFlows
      parameters:
        - $ref: "#/components/parameters/IpPath"
        - $ref: "#/components/parameters/EventFilterQuery"
        - $ref: "#/components/parameters/EventTypeQuery"
        - $ref: "#/components/parameters/SensorIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - $ref: "#/components/parameters/WindowQuery"
        - $ref: "#/components/parameters/DstIpQuery"
        - $ref: "#/components/parameters/DomainQuery"
        - $ref: "#/components/parameters/UserAgentQuery"
        - $ref: "#/components/parameters/FingerprintQuery"
        - $ref: "#/components/parameters/PortQuery"
        - $ref: "#/components/parameters/ProtoQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
      responses:
        "200":
          description: DPI flow samples for one source IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiFlowListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /risks:
    get:
      operationId: listRisks
      parameters:
        - $ref: "#/components/parameters/LevelQuery"
        - name: q
          in: query
          schema:
            type: string
        - name: sensor_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/CampusIdQuery"
        - $ref: "#/components/parameters/DepartmentQuery"
        - $ref: "#/components/parameters/PersonTypeQuery"
        - $ref: "#/components/parameters/SSIDQuery"
        - $ref: "#/components/parameters/VLANQuery"
        - $ref: "#/components/parameters/APQuery"
        - $ref: "#/components/parameters/NASIPQuery"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: include_weak
          in: query
          description: Include weak-signal-only device inventories. Defaults to false so the device list focuses on high-confidence IP/device profiles.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Filtered risk snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/risk:
    get:
      operationId: getIpRisk
      parameters:
        - $ref: "#/components/parameters/IpPath"
      responses:
        "200":
          description: Current risk snapshot for an IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/evidence:
    get:
      operationId: getIpEvidence
      parameters:
        - $ref: "#/components/parameters/IpPath"
        - name: limit
          in: query
          description: Maximum number of recent evidence items to return for the IP timeline.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Evidence timeline for an IP.
          content:
            application/json:
              schema:
                type: object
                required: [evidence]
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: "#/components/schemas/Evidence"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/activity:
    get:
      operationId: getIpActivity
      parameters:
        - $ref: "#/components/parameters/IpPath"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Aggregated access and client feature profile for an IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpActivityProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/devices:
    get:
      operationId: getIpDevices
      parameters:
        - $ref: "#/components/parameters/IpPath"
        - name: sensor_id
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [10m, 1h, 24h]
            default: 1h
      responses:
        "200":
          description: Conservative device inventory derived from normalized signals for an IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpDeviceInventory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /ips/{ip}/events:
    get:
      operationId: getIpEvents
      parameters:
        - $ref: "#/components/parameters/IpPath"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Normalized event summaries for an IP.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/NormalizedEventSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /accounts/{account_id}/identity:
    get:
      operationId: getAccountIdentity
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/SensorIdQuery"
        - $ref: "#/components/parameters/WindowQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - name: limit
          in: query
          schema:
