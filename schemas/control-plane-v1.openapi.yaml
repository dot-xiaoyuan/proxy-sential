        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Newest-first paged immutable history, with stable timestamp and ID ordering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseHistoryResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cases/{case_id}/{operation}:
    post:
      operationId: updateCase
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
        - { name: operation, in: path, required: true, schema: { type: string, enum: [assign, status, priority, disposition, comments] } }
