        - { name: kind, in: path, required: true, schema: { type: string, enum: [campuses, buildings, network-zones, access-points] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201": { description: Organization or network-location mapping saved. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /actions/connectors:
    get:
      operationId: listActionConnectors
      responses:
        "200":
          description: Northbound connectors without credential material.
          content:
            application/json:
              schema:
                type: object
                required: [items, global_stop]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ActionConnector" } }
                  global_stop: { type: boolean }
    post:
      operationId: saveActionConnector
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Connector saved; secret is never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionConnector" }
  /actions/connectors/{connector_id}/account-preview:
    get:
      operationId: previewNativeAccountDisconnect
      description: Read-only account targets for one configured source. Requires actions:read; never authorizes execution or proves global account coverage.
      parameters:
        - { name: connector_id, in: path, required: true, schema: { type: string } }
        - { name: account_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
      responses:
        "200":
          description: Scoped session plan and confirmation fingerprint; session targets contain account, instance_id, session_id, raw_online_id and binding_hash with normalized addresses.
          content:
            application/json:
              schema:
                type: object
                required: [connector_id, read_only, coverage, observed_at, plan]
                properties:
                  connector_id: { type: string }
                  read_only: { type: boolean, enum: [true] }
                  coverage: { type: string, enum: [configured_source_only, account_observation_only] }
                  observed_at: { type: string, format: date-time }
                  plan: { type: object, additionalProperties: true }
        "400": { description: Invalid account. }
        "404": { description: Native connector unavailable. }
        "409": { description: Cannot establish current account targets. }
        "503": { description: Complete inventory unavailable. }
  /actions/connectors/{connector_id}/4k-database:
    parameters:
      - in: path
        name: connector_id
        required: true
        schema: { type: string }
    get:
      operationId: getFourKDatabase
      description: Requires integrations:write. Returns database configuration without passwords or appSecret.
      responses:
        '200':
          description: Public configuration and password_configured; password is never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FourKDatabaseResponse' }
    put:
      operationId: saveFourKDatabase
      description: Requires integrations:write. Encrypts database password; an omitted or empty password preserves the existing password. Performs no remote database I/O.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FourKDatabaseConfig' }
      responses:
        '200':
          description: Saved configuration without password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FourKDatabaseResponse' }
    post:
      operationId: checkFourKDatabase
      description: Returns a persisted operation task (202); query /tasks/{task_id} for the authorization check result. Requires integrations:write. SELECT only in a read-only MySQL transaction. Selects enabled unexpired authorization, requiring an explicit ID if multiple are available. Does not verify management API or issue a disconnect.
      responses:
        '202':
          description: Persisted authorization check task; completed task result contains authorization metadata without appSecret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationTask' }
        '502':
          description: Database unavailable, no usable authorization, or ambiguous selection. Never treated as successful authentication.
  /actions/connectors/{connector_id}/test:
    post:
      operationId: testActionConnector
      parameters:
        - { name: connector_id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Connectivity probe durably queued. Inspect the task result for reachability, errors or timeout; acceptance is not proof of enforcement capability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationTask" }
        "200":
          description: Connectivity probe succeeded. Managed 4K connectors authenticate using saved database authorization and query a read-only management endpoint. A result with identity_verified=false does not verify authoritative inventory or permit enforcement. Private runtimes additionally check their inventory; reachability never grants shadow admission.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /actions/emergency-stop:
    post:
      operationId: updateActionEmergencyStop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        "200": { description: Global enforcement stop updated. }
  /actions:
    get:
      operationId: listActions
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated enforcement actions.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EnforcementAction" } }
                  page: { $ref: "#/components/schemas/Page" }
  /actions/execute:
    post:
      operationId: executeAction
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Action persisted before asynchronous delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementAction" }
  /actions/{action_id}:
    get:
      operationId: getAction
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Enforcement action with retry, remote result and reversal linkage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementAction" }
        "404": { $ref: "#/components/responses/NotFound" }
  /actions/{action_id}/native-observations:
    get:
      operationId: listNativeActionObservations
      description: Requires actions:read. Append-only observations in insertion order; not proof of completed account enforcement.
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Action-scoped native observation page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeObservationPage" }
        "400": { description: Invalid cursor or page size. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Native observation database unavailable. }
  /actions/{action_id}/revoke:
    post:
      operationId: revokeAction
      description: Stops pending native disconnect dispatch or requests release for a reversible action. Native cancellation cannot recall an already sent request or restore a disconnected session.
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Revocation accepted. Native disconnect returns the original action with blocked status; this does not prove remote restoration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnforcementAction" }
        "409": { description: Completed one-shot disconnect cannot restore the original session. }
        "503": { description: Native cancellation persistence unavailable; retry the same request. }
  /actions/callback:
    post:
      operationId: acceptActionCallback
      security: []
      parameters:
        - { name: X-Proxy-Sentinel-Timestamp, in: header, required: true, schema: { type: string, format: date-time } }
        - { name: X-Proxy-Sentinel-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Authenticated callback accepted idempotently. }
        "401": { description: Invalid HMAC signature or stale timestamp. }
  /integrations/identity/events:
    post:
      operationId: ingestIdentityEvents
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      security:
        - IdentityBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Identity batch normalized and accepted.
  /integrations/identity/snapshots:
    post:
      operationId: commitIdentitySnapshot
      description: Atomically submit one complete online inventory for a source, sensor, campus and access domain. Requires the identity integration token and respects the global read-only switch. Incomplete inventories never close sessions. Maximum 10000 sessions per scope; do not split an inventory into independently complete requests.
      security:
        - IdentityBearer: []
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentitySnapshotRequest' }
      responses:
        "202":
          description: Complete snapshot and audit record committed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySnapshotReceipt' }
        "200":
          description: Identical snapshot was already committed; freshness is not advanced by retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySnapshotReceipt' }
        "400": { description: Incomplete inventory, count mismatch, invalid record, scope conflict or invalid observation time. }
        "401": { description: Invalid identity integration token. }
        "403": { description: Global read-only mode. }
        "409": { description: Snapshot identity or observation time already contains different content, or storage does not support reconciliation. }
        "503": { description: Database commit failed or its result is uncertain; retry the same immutable request and key. }
  /integrations/identity/status:
    get:
      operationId: getIdentityIngestStatus
      responses:
        "200":
          description: Recent identity batches and complete-inventory freshness; requires integrations:write. Registered sources appear before their first snapshot; unregistered historical sources are identified. Freshness uses observation time, not receipt or retry time.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, last_received_at, completed_batches, failed_batches, reconciliation_supported, sources]
                properties:
                  enabled: { type: boolean }
                  last_received_at: { type: string }
                  completed_batches: { type: integer }
                  failed_batches: { type: integer }
                  reconciliation_supported: { type: boolean }
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/IdentitySourceStatus' }
  /integrations/identity/batches:
    get:
      operationId: listIdentityBatches
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated identity batches with status, error detail and retry count.
