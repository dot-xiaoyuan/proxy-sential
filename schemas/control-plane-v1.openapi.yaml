openapi: 3.1.0
info:
  title: Proxy Sentinel Control Plane API
  version: 1.0.0
  description: Control-plane contract for the Proxy Sentinel frontend. The API exposes normalized events, evidence, risk snapshots, labels, shadow runs, audit logs, and session state.
servers:
  - url: /api/v1
paths:
  /discovery/nodes:
    get:
      description: Discovery worker heartbeat; requires identity:read.
      responses:
        '200':
          description: Node availability
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /discovery/sources:
    get:
      operationId: getDiscoverySources
      description: Scoped discovery data; requires identity:read. Does not change terminal last_seen or risk identity.
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      description: Requires integrations:write. Credentials are write-only and encrypted; versions use optimistic concurrency. Scan changes disable scheduling and invalidate prior trial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Saved configuration without credentials }
        '409': { description: Configuration version conflict }
  /discovery/devices:
    get:
      operationId: getDiscoveryDevices
      description: Windowed passive, infrastructure, or active discovery read model; requires identity:read. Does not claim online state or create terminal identities.
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [passive, infrastructure, active, all], default: all } }
        - { name: window, in: query, schema: { type: string, default: 24h } }
        - { name: search, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: capability, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /router-observations:
    get:
      operationId: listRouterObservations
      description: Passive Huawei/H3C router observations in shadow mode; requires identity:read and never triggers enforcement.
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: ip, in: query, schema: { type: string } }
        - { name: mac, in: query, schema: { type: string } }
        - { name: vlan, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [router, ap, switch, firewall, endpoint, unknown] } }
        - { name: status, in: query, schema: { type: string, enum: [candidate, likely, confirmed] } }
        - { name: source, in: query, schema: { type: string } }
        - { name: confidence_min, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: confidence_max, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: first_seen_from, in: query, schema: { type: string, format: date-time } }
        - { name: first_seen_to, in: query, schema: { type: string, format: date-time } }
        - { name: last_seen_from, in: query, schema: { type: string, format: date-time } }
        - { name: last_seen_to, in: query, schema: { type: string, format: date-time } }
        - { name: infrastructure, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Router observation page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterAssessmentPage' }
  /router-observations/{assessment_id}:
    get:
      operationId: getRouterObservation
      description: Passive router observation details, evidence timeline and status history; requires identity:read.
      parameters:
        - { name: assessment_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Router observation detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterObservationDetail' }
        '404': { description: Router observation not found }
  /discovery/tasks:
    get:
      operationId: getDiscoveryTasks
      description: Scoped discovery data; requires identity:read. Does not change terminal last_seen or risk identity.
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /discovery/summary:
    get:
      operationId: getDiscoverySummary
      description: Scoped discovery data; requires identity:read. Does not change terminal last_seen or risk identity.
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /discovery/scan-profiles:
    get:
      operationId: getDiscoveryScanProfiles
      description: Scoped discovery data; requires identity:read. Does not change terminal last_seen or risk identity.
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      description: Requires integrations:write. Credentials are write-only and encrypted; versions use optimistic concurrency. Scan changes disable scheduling and invalidate prior trial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Saved configuration without credentials }
        '409': { description: Configuration version conflict }
  /discovery/endpoint-evidence:
    get:
      operationId: getDiscoveryEndpointEvidence
      description: Scoped discovery data; requires identity:read. Does not change terminal last_seen or risk identity.
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /discovery/sources/{id}/poll:
    post:
      description: 'Queue immutable SNMP snapshot; requires integrations:write.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Operation completed }
        '202': { description: Task queued }
        '400': { description: Invalid scope or configuration }
        '409': { description: Task pending or current trial required }
  /discovery/tasks/{id}/stop:
    post:
      description: 'Cancel a pending or running task; requires integrations:write.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Operation completed }
        '202': { description: Task queued }
        '400': { description: Invalid scope or configuration }
        '409': { description: Task pending or current trial required }
  /discovery/scan-profiles/{id}/trial:
    post:
      description: 'Queue a bounded manual scan; requires integrations:write.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Operation completed }
        '202': { description: Task queued }
        '400': { description: Invalid scope or configuration }
        '409': { description: Task pending or current trial required }
  /discovery/scan-profiles/{id}/schedule:
    post:
      description: 'Enable or disable scheduling; current version trial required; requires integrations:write.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Operation completed }
        '202': { description: Task queued }
        '400': { description: Invalid scope or configuration }
        '409': { description: Task pending or current trial required }
  /discovery/preview:
    post:
      description: 'Preview explicit allowed targets without network probes; requires integrations:write.'
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Operation completed }
        '202': { description: Task queued }
        '400': { description: Invalid scope or configuration }
        '409': { description: Task pending or current trial required }
  /shared-access/reviews:
    get:
      operationId: listSharedAccessReviews
      description: Requires cases:read. Stable database keyset pagination by created_at and review_id. Empty does not prove no shared behavior.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Review page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SharedAccessReview' } }
                  next_cursor: { type: string }
  /shared-access/reviews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSharedAccessReview
      description: Requires cases:read. Latest evidence summary and latest human conclusion; full histories are loaded separately.
      responses:
        '200':
          description: Review summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedAccessReview' }
        '404': { description: Review does not exist }
  /shared-access/reviews/{id}/evidence:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSharedReviewEvidence
      description: Requires cases:read. Append-only versions descending. Bounded original references are a summary and not a full packet history.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, description: Previous page last version, schema: { type: string } }
      responses:
        '200':
          description: Evidence versions page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedReviewHistoryPage' }
  /shared-access/reviews/{id}/executions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSharedReviewExecutions
      description: Requires cases:read. Only explicitly linked actions; does not attach unrelated account actions.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Linked execution page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedReviewHistoryPage' }
  /shared-access/reviews/{id}/conclusion:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: concludeSharedAccessReview
      description: Requires cases:write. Version-bound human conclusion and audit saved atomically. Never grants punishment authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_version, conclusion, reason]
              properties:
                evidence_version: { type: integer, minimum: 1 }
                conclusion: { type: string, enum: [shared, normal, insufficient] }
                reason: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200': { description: Conclusion saved with enforcement_ready=false }
        '409': { description: Evidence changed, re-review required }
  /shared-access/reviews/{id}/disconnect-preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: previewSharedReviewDisconnect
      description: Requires actions:execute and cases:read. Durable task queries complete authoritative identity and current evidence; completed task result is SharedDisconnectPreview. Does not send controls.
      x-performance-category: task-submission
      responses:
        '202': { description: Preview task persisted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationTask' } } } }
        '403': { description: Permission, CSRF or read-only restriction }
        '404': { description: Review does not exist }
  /shared-access/reviews/{id}/disconnect:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
    post:
      operationId: confirmSharedReviewDisconnect
      description: Requires integrations:write, actions:execute and cases:write. Explicit yuantong test only, shadow connector, immutable 15-minute grant and five-minute account/scope cooldown. Task result contains grant_id and action_ids. Accepted does not prove offline. Every send revalidates current authority, evidence, exceptions and emergency stop. User logout is a separate unsupported capability.
      x-performance-category: task-submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, evidence_version, identity_version, config_version, authorize_designated_test]
              properties:
                fingerprint: { type: string, minLength: 1 }
                evidence_version: { type: integer, minimum: 1 }
                identity_version: { type: integer, minimum: 1 }
                config_version: { type: string }
                authorize_designated_test: { type: boolean, const: true }
      responses:
        '202': { description: Confirmation task persisted; business validation and target outcomes are obtained from the task and linked execution records, content: { application/json: { schema: { $ref: '#/components/schemas/OperationTask' } } } }
        '400': { description: Missing idempotency key or invalid task submission }
        '403': { description: Permission, CSRF or read-only restriction }
        '404': { description: Review does not exist }
  /actions/connectors/{id}/identity-source:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getManagedIdentitySource
      description: Requires integrations:write. Returns public configuration and current sync status; never returns credentials.
      responses:
        '200':
          description: Public identity configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedIdentitySource' }
    put:
      operationId: saveManagedIdentitySource
      description: Synchronous version-checked save, resets authority until successful complete reconciliation. Requires integrations:write. Blank token preserves only the same inventory URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration, config_version]
              properties:
                configuration: { $ref: '#/components/schemas/ManagedIdentityConfiguration' }
                config_version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Saved immediately visible configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedIdentitySource' }
        '409': { description: Configuration changed or connector is not native 4K }
  /shared-access/status:
    get:
      operationId: getSharedAccessStatus
      description: Requires identity:read. Explicit unknown or blocked states are returned until independently verified. Configured does not mean healthy.
      responses:
        '200':
          description: Shared access chain status and blockers
          content:
            application/json:
              schema:
                type: object
                required: [checked_at, identity, collection, materialization, policy, controller]
                properties:
                  checked_at: { type: string, format: date-time }
                  identity: { type: array, items: { type: object, additionalProperties: true } }
                  collection: { type: object, additionalProperties: true }
                  materialization: { type: object, additionalProperties: true }
                  policy: { type: object, additionalProperties: true }
                  controller: { type: object, additionalProperties: true }
  /shared-access/observations:
    get:
      operationId: listSharedBehaviorObservations
      description: Passive shared-gateway behavior observations; requires cases:read. Results are shadow-only and never authorize enforcement.
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: ip, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [candidate, likely, confirmed] } }
        - { name: coverage_state, in: query, schema: { type: string, enum: [unknown, partial, verified] } }
        - { name: confidence_min, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Searchable shared-gateway observation page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedBehaviorPage' }
        '400': { description: Invalid filter or pagination }
  /shared-access/observations/{observation_id}:
    get:
      operationId: getSharedBehaviorObservation
      description: Shared-gateway score, evidence references, router correlation and immutable decision history; requires cases:read.
      parameters:
        - { name: observation_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Shared-gateway observation detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedBehaviorDetail' }
        '404': { description: Shared-gateway observation not found }
  /policies:
    get:
      operationId: listAccountPolicies
      responses:
        '200':
          description: Policies ordered by descending priority and stable ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountPolicy' }
    post:
      operationId: createAccountPolicy
      description: Always creates a disabled policy in observe mode. Requires policies:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPolicy' }
      responses:
        '200':
          description: Saved policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPolicy' }
  /policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateAccountPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPolicy' }
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPolicy' }
  /policies/{id}/simulate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: simulateAccountPolicy
      description: Read-only evaluation against stored event-time identity; requires policies:read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id: { type: string }
                at: { type: string, format: date-time }
      responses:
        '200':
          description: Quota lower bound, coverage, sessions, selections and explanations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  evaluations:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        policy_id: { type: string }
                        shared_error: { type: string }
                        shared_evaluation:
                          type: array
                          items: { $ref: '#/components/schemas/SharedAccessEvaluation' }
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyIdentitySession' }
  /accounts/{id}/quota:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAccountQuota
      responses:
        '200':
          description: Current account inventory and configured quota evaluations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyIdentitySession' }
  /policy-executions:
    get:
      operationId: listPolicyExecutions
      parameters:
        - { name: account_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Persistent policy episodes and stage child action IDs
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /policy-executions/{id}/approval-preview:
    get:
      operationId: previewPolicyApproval
      description: Read-only current account sessions, stage parameters, evidence IDs and fingerprint. Requires policies:read. Preview does not authorize execution.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Approval preview
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { description: No pending approval or incomplete identity }
  /policy-executions/{id}/{operation}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: operation, in: path, required: true, schema: { type: string, enum: [approve, revoke] } }
    post:
      operationId: mutatePolicyExecution
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprint: { type: string, description: Required for disconnect approvals; must match a fresh approval-preview. }
      description: approve requires policies:authorize; revoke requires actions:revoke and cancels pending stages. Shared-access evidence supports manual disconnect only, requires a matching confirmation fingerprint and fresh evidence plus current account identity; automatic enforcement remains forbidden.
      responses:
        '200': { description: Updated execution }
  /application-library/jobs/{operation}:
    parameters:
      - { name: operation, in: path, required: true, schema: { type: string, enum: [pause, resume, cancel] } }
    post:
      operationId: controlApplicationHistoryJob
      description: Operation takes effect between committed batches; results and cursor are retained.
      responses:
        '200': { description: Updated application job status }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session with a CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials or rate limit reached.
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Session deleted.
  /auth/oidc/start:
    get:
      operationId: startOIDCLogin
      responses:
        "302":
          description: Redirect to the configured OIDC provider using PKCE, state, and nonce.
        "404":
          description: OIDC is not enabled.
  /auth/oidc/callback:
    get:
      operationId: completeOIDCLogin
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302":
          description: OIDC session created and redirected to the control plane.
        "401":
          description: OIDC response validation failed.
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current mock or authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "500":
          $ref: "#/components/responses/InternalError"
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          description: Readiness of storage, authentication, identity ingestion, collector freshness, and the offline fingerprint library.
          content:
            application/json:
              schema:
                type: object
                required: [status, components, checked_at]
                properties:
                  status: { type: string, enum: [ready, degraded] }
                  components:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status: { type: string }
                        error: { type: string }
                        updated_at: { type: string, format: date-time }
                  fingerprint_library: { type: object, additionalProperties: true }
                  fingerprint_offline_mode: { type: boolean }
                  global_read_only: { type: boolean }
                  checked_at: { type: string, format: date-time }
  /exports:
    post:
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExportRequest"
      responses:
        "202":
          description: Export queued for background generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "400": { description: Invalid kind or time range. }
        "403": { description: Export permission required. }
  /exports/{export_id}:
    get:
      operationId: getExport
      parameters:
        - { name: export_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Export status visible to its creator or an administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "404": { description: Export not found. }
  /exports/{export_id}/cancel:
    post:
      operationId: cancelExport
      parameters:
        - { name: export_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Persisted cancellation, visible to the creator or an administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "409": { description: Export has already completed or failed. }
        "503": { description: Cancellation could not be persisted. }
  /exports/{export_id}/download:
    get:
      operationId: downloadExport
      parameters:
        - { name: export_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Completed CSV or unknown-domain JSONL export.
          content:
            text/csv:
